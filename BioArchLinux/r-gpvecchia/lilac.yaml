build_prefix: extra-x86_64
maintainers:
- github: adityaruplaha
  email: me@adityaruplaha.me
repo_depends:
- r-fields
- r-fnn
- r-gpgp
- r-rcpp
- r-sparseinv
repo_makedepends:
- r-bh
- r-rcpparmadillo
update_on:
- source: rpkgs
  pkgname: GPvecchia
  repo: cran
  md5: true
- alias: r
- source: alpmfiles
  pkgname: blas
  filename: usr/lib/libblas\.so\.([^.]+)
  repo: extra
- source: alpmfiles
  pkgname: lapack
  filename: usr/lib/liblapack\.so\.([^.]+)
  repo: extra
