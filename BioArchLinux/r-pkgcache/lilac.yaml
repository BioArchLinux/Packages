build_prefix: extra-x86_64
maintainers:
- github: pekkarr
  email: pekkarr@protonmail.com
repo_depends:
- r-callr
- r-cli
- r-curl
- r-filelock
- r-jsonlite
- r-processx
- r-r6
- r-tsitter
- r-tstoml
repo_makedepends:
- r-mockery
- r-spelling
- r-testthat
- r-webfakes
# pak 0.11.1 uses pkgcache's unreleased feature/ppm-sso branch.
# Review the pinned commit manually when pak changes its bundled revision.
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
update_on:
- source: manual
  manual: '2.2.5.9000'
- alias: r
