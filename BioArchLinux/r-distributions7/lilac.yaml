maintainers:
- github: sukanka
  email: sukanka@askk.cc
build_prefix: extra-x86_64
repo_depends:
- r-assertthat
- r-generics
- r-ggplot2
- r-ggrepel
- r-gnorm
- r-goftest
- r-jaspgraphs
- r-nortest
- r-patchwork
- r-rlang
- r-s7
- r-sgt
- r-sn
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
# No upstream tags; keep the commit pinned to jaspDistributions's lockfile.
update_on:
- source: manual
  manual: '0.1.1'
- alias: r
