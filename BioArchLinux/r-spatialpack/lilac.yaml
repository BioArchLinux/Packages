build_prefix: extra-x86_64
maintainers:
- github: adityaruplaha
  email: me@adityaruplaha.me
repo_depends:
- r-fastmatrix
update_on:
- source: rpkgs
  pkgname: SpatialPack
  repo: cran
  md5: true
- alias: r
- source: alpmfiles
  pkgname: blas
  filename: usr/lib/libblas\.so\.([^.]+)
  repo: extra
- source: alpmfiles
  pkgname: lapack
  filename: usr/lib/liblapack\.so\.([^.]+)
  repo: extra
