build_prefix: extra-x86_64
maintainers:
- github: adityaruplaha
  email: me@adityaruplaha.me
repo_depends:
- r-beachmat
- r-biocneighbors
- r-delayedarray
- r-rcpp
- r-s4vectors
- r-sparsearray
repo_makedepends:
- r-assorthead
- r-rigraphlib
update_on:
- source: rpkgs
  pkgname: scrapper
  repo: bioc
  md5: true
- alias: r
- source: alpmfiles
  pkgname: blas
  filename: usr/lib/libblas\.so\.([^.]+)
  repo: extra
- source: alpmfiles
  pkgname: lapack
  filename: usr/lib/liblapack\.so\.([^.]+)
  repo: extra
